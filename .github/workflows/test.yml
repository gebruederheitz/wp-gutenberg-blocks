name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: "/usr/share/zoneinfo/Europe/Berlin"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup languages and tools
        uses: gebruederheitz/actions/cached-asdf@v1
        with:
          setup-task: true

      - name: Composer Cache
        uses: gebruederheitz/actions/composer-cache@v1

      - name: Run the test suite
        run: task ci:test

  lint:
    runs-on: ubuntu-latest
    env:
      TZ: "/usr/share/zoneinfo/Europe/Berlin"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup languages and tools
        uses: gebruederheitz/actions/cached-asdf@v1
        with:
          setup-task: true

      - name: Composer Cache
        uses: gebruederheitz/actions/composer-cache@v1

      - name: Run the linting suite
        run: task lint
